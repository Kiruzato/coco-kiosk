<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoCo Developer — Login</title>
    <link rel="stylesheet" href="/static/login.css">
    <style>
        body {
            background: linear-gradient(135deg, #2c3e50 0%, #1a1a2e 100%);
        }
        header h1 { color: #e74c3c; }
        .form-group input:focus {
            border-color: #e74c3c;
            box-shadow: 0 0 0 3px rgba(231, 76, 60, 0.1);
        }
        .btn-primary {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
        }
        .btn-primary:hover:not(:disabled) {
            box-shadow: 0 4px 12px rgba(231, 76, 60, 0.4);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <header>
                <h1>Developer Tools</h1>
                <p class="subtitle">CoCo - Columban College</p>
            </header>

            <form id="loginForm">
                <div class="form-group">
                    <label for="password">Developer Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter developer password"
                        required
                        autofocus
                    >
                </div>

                <div id="errorMessage" class="error-message hidden"></div>

                <button type="submit" id="loginBtn" class="btn-primary">
                    Login
                </button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');
            const loginBtn = document.getElementById('loginBtn');

            errorDiv.classList.add('hidden');
            errorDiv.textContent = '';
            loginBtn.disabled = true;
            loginBtn.textContent = 'Logging in...';

            try {
                const response = await fetch('/dev/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });

                const data = await response.json();

                if (response.ok) {
                    window.location.href = data.redirect || '/dev';
                } else {
                    errorDiv.textContent = data.detail || 'Invalid password';
                    errorDiv.classList.remove('hidden');
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Login';
                }
            } catch (error) {
                errorDiv.textContent = 'Connection error. Please try again.';
                errorDiv.classList.remove('hidden');
                loginBtn.disabled = false;
                loginBtn.textContent = 'Login';
            }
        });
    </script>
</body>
</html>
