<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoCo Developer Tools</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #2c3e50 0%, #1a1a2e 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 600px;
            margin: 50px auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            color: #e74c3c;
            font-size: 28px;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
        }

        .warning {
            background: #fff3cd;
            border: 1px solid #ffc107;
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 13px;
            color: #856404;
            margin-bottom: 20px;
        }

        .toggle-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .toggle-label {
            font-weight: 600;
            font-size: 16px;
        }

        .toggle-description {
            font-size: 13px;
            color: #666;
            margin-top: 4px;
        }

        /* Toggle Switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: 0.3s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: 0.3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #e74c3c;
        }

        input:checked + .slider:before {
            transform: translateX(26px);
        }

        .status-display {
            text-align: center;
            padding: 15px;
            border-radius: 8px;
            font-weight: 600;
        }

        .status-display.off {
            background: #d4edda;
            color: #155724;
        }

        .status-display.on {
            background: #f8d7da;
            color: #721c24;
        }

        .notification {
            padding: 12px 20px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .notification.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .notification.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .hidden {
            display: none !important;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #fff;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <header>
                <h1>Developer Tools</h1>
                <p class="subtitle">Phase 17A.1 - RAG Debugging</p>
            </header>

            <div class="warning">
                This page is for development and testing only. Changes affect all users immediately.
            </div>

            <div id="notification" class="notification hidden"></div>

            <div class="toggle-section">
                <div>
                    <div class="toggle-label">RAG-Only Mode</div>
                    <div class="toggle-description">Disable general AI knowledge for debugging</div>
                </div>
                <label class="switch">
                    <input type="checkbox" id="ragOnlyToggle">
                    <span class="slider"></span>
                </label>
            </div>

            <div id="statusDisplay" class="status-display off">
                Hybrid Mode (RAG + General AI)
            </div>
        </div>

        <a href="/" class="back-link">Back to Kiosk</a>
    </div>

    <script src="/static/dev.js"></script>
</body>
</html>
